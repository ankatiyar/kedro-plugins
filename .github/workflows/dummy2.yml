name: Run unit tests

on:
  workflow_call:
    inputs:
      os:
        type: string
      python-version:
        type: string

jobs:

  unit-tests:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python ${{inputs.python-version}}
        uses: actions/setup-python@v3
        with:
          python-version: ${{inputs.python-version}}
      - name: Create annotation for build error
        if: inputs.os == 'ubuntu-latest'
        run: exit 1